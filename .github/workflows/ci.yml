name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        pip install -r PropFirm_System/requirements.txt
        pip install ruff pytest pytest-mock
    - name: Run Tests
      run: |
        cd PropFirm_System
        PYTHONPATH=. pytest tests/
    - name: Run Ruff
      run: |
        cd PropFirm_System
        ruff check .
